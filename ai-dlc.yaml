# 프로젝트 연결 데이터다. 작업 범위와 결정 권한은 공통 운영 루트 ai-dlc의 AGENTS.md를 따른다.
schema_version: 2
active_service: askteacher

services:
  askteacher:
    repositories:
      common:
        enabled: true
        repository: marcel615/Ask-Teacher-specs
        default_branch: main
      frontend:
        enabled: true
        repository: marcel615/Ask-Teacher-react
        default_branch: develop
      backend:
        enabled: true
        repository: marcel615/Ask-Teacher-spring
        default_branch: develop

    work_tracking:
      provider: jira

    jira:
      site_url: https://marcel615.atlassian.net
      project_key: ASK
      issue_types:
        candidate: 작업
        implementation: 작업
        epic: 에픽
        contract: 작업
      statuses:
        candidate: 아이디어 후보
        backlog: 할 일
        ready: 착수 가능
        in_progress: 진행 중
        in_review: 검토 중
        done: 완료
      role_labels:
        backend: 'area:backend'
        frontend: 'area:frontend'
      approval: user_transition_to_backlog
      priority_order: [Highest, High, Medium, Low, Lowest]

    project:
      owner: marcel615
      number: 1
      id: PVT_kwHOA3_2Ds4BqsK-
      url: https://github.com/users/marcel615/projects/1
      fields:
        status: Status
        approval: Approval
        proposer: Proposer
        candidate_id: Candidate ID
        priority: Priority
        target_date: Target date
      statuses:
        backlog: Backlog
        ready: Ready
        in_progress: In Progress
        in_review: In Review
        done: Done
      approval_values:
        pending: Pending
        approved: Approved
      proposer_values:
        user: User
        ai: AI
      priority_values:
        high: High
        medium: Medium
        low: Low

    labels:
      decision: 'needs: decision'
      priority:
        high: 'priority: high'
        medium: 'priority: medium'
        low: 'priority: low'

    requirements:
      repository_role: common
      path: docs/requirements.md
      format: markdown

    contracts:
      api:
        repository_role: common
        path: docs/openapi.yaml
        format: openapi
      authentication:
        repository_role: common
        path: docs/auth-policy.md
        format: markdown
      erd:
        repository_role: common
        path: docs/schema.dbml
        format: dbml
      ui:
        repository_role: common
        path: docs/ui-spec.md
        format: markdown

    development:
      branch_pattern: 'feature/issue-번호-작업명'
      branch_prefix: 'feature/'
      protected_branches:
        - main
        - develop
      build_command: 'npm run build'
      lint_command: 'npm run lint'

# 명세는 해당 repository_role의 default_branch에서 조회하며 원문을 복사하지 않는다.
# 선택한 작업 추적 도구의 유형·상태·권한과 필요한 라벨은 사용 전 실제 값과 대조한다.
# 토큰과 인증 정보는 기록하지 않는다.
